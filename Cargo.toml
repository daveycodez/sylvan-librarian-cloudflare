[workspace]
resolver = "2"
members = [
    "vendor/sylvan_librarian/card_engine",
    "engine/wasm",
    "engine/wasm-builder-probe",
    "engine/builder",
]

# Tuned for the wasm engine (size + speed inside a Worker isolate); built
# locally via wasm-pack, with the pkg committed, so its cost never hits CI.
[profile.release]
lto = true
codegen-units = 1

# Container-image builds only: the import binary is a network-bound batch job,
# so fat LTO buys nothing there while dominating CI build time. The wasm
# engine keeps the tuned [profile.release] (built locally, pkg committed).
[profile.container]
inherits = "release"
lto = false
codegen-units = 16
