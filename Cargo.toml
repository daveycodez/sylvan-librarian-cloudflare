[workspace]
resolver = "2"
members = [
    "vendor/sylvan_librarian/card_engine",
    "engine/wasm",
    "engine/wasm-builder-probe",
    "engine/wasm-import",
    "engine/builder",
    "engine/inflate",
]

# Tuned for the wasm engine (size + speed inside a Worker isolate); built
# locally via wasm-pack, with the pkg committed, so its cost never hits CI.
[profile.release]
lto = true
codegen-units = 1

# The native store builder, wherever it is compiled on demand: Workers Builds
# during a deploy, or a laptop on first `bun dev`. It is a network- and
# IO-bound batch job whose actual work is ~20s, so fat LTO and one codegen unit
# buy nothing measurable while dominating compile time — 22.0s → 12.9s on this
# workspace's own two crates alone, before counting the dependency tree, where
# codegen-units=1 hurts just as much. The wasm engine keeps the tuned
# [profile.release]: it is built locally and its pkg is committed, so its
# compile time is paid once by a human, never in a deploy.
[profile.fast-native]
inherits = "release"
lto = false
codegen-units = 16
