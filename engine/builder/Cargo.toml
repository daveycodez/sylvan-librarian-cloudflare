[package]
name = "sylvan-store-builder"
version = "0.1.0"
edition = "2024"

[lib]
name = "sylvan_store_builder"

[[bin]]
name = "sylvan-store-builder"
path = "src/main.rs"

[dependencies]
card_engine = { path = "../../vendor/sylvan_librarian/card_engine" }
serde_json = "1"

# ── Scryfall import pipeline (bulk.rs / transform.rs / tags.rs / r2.rs) ──────
# Gzip: Scryfall serves .jsonl.gz payloads with no Content-Encoding header.
# Default features = pure-Rust miniz_oxide backend; no C zlib in the container.
flate2 = "1"
# Blocking HTTP with rustls only — no openssl-sys, container stays slim.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# S3 SigV4 presigning for R2 — small, tokio-free. Default features include the
# pure-Rust "rustcrypto" hmac/sha2 backend and "xml" multipart response parsing.
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# fold_accents(): NFKD + strip combining marks, mirroring Python unicodedata.
unicode-normalization = "0.1"
url = "2"
