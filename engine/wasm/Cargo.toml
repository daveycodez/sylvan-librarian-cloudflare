[package]
name = "sylvan-engine-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
card_engine = { path = "../../vendor/sylvan_librarian/card_engine" }
wasm-bindgen = "0.2"
serde_json = "1"

# card_engine's `rand` pulls in `getrandom`, which refuses to compile for
# wasm32-unknown-unknown unless a backend is chosen. The `wasm_js` feature +
# the `getrandom_backend="wasm_js"` rustflag (wired for this target in the
# workspace .cargo/config.toml) select the JS crypto backend, which Cloudflare
# Workers support. Only the wasm target needs (or can use) this.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
